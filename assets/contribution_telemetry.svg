<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" height="100%">
  <defs>
    <linearGradient id="telBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#03161e"/>
    </linearGradient>

    <linearGradient id="roverTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>

    <filter id="headGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="snakeTrack" d="M 38,82 L 1162,82 L 1162,102 L 38,102 L 38,122 L 1162,122 L 1162,142 L 38,142"/>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .c-lvl1 { fill: #0f172a; }
    .c-lvl2 { fill: #0e7490; animation: cellPulse 5s infinite ease-in-out; }
    .c-lvl3 { fill: #0284c7; animation: cellPulse 3.8s infinite ease-in-out; }
    .c-lvl4 { fill: #10b981; animation: cellPulse 2.6s infinite ease-in-out; }
    .c-lvl5 { fill: #22d3ee; animation: cellPulse 1.9s infinite ease-in-out; }
    @keyframes cellPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="1200" height="185" rx="14" fill="url(#telBg)" stroke="#155e75" stroke-width="1.4"/>

