  <!-- Animated Orbital Swath Snake Traversing the Contribution Grid -->
  <use href="#snakeTrack" fill="none" stroke="url(#roverTrail)" stroke-width="5" stroke-linecap="round"
       stroke-dasharray="220 4600">
    <animate attributeName="stroke-dashoffset" values="4820;0" dur="14s" repeatCount="indefinite"/>
  </use>

  <g filter="url(#headGlow)">
